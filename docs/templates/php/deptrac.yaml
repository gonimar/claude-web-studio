# deptrac — the layer rule of `php_architecture: layered` (stack-reference/php.md "Layered architecture").
# Web Studio template; installed by /setup-stack or /test-setup as deptrac.yaml in the PHP root.
# Run: vendor/bin/deptrac analyse (composer script `arch-check`, part of `composer ci`).
# FRAMEWORK_NAMESPACES is replaced with the framework's root namespaces (Yii3: Yiisoft\; Symfony: Symfony\;
# Laravel: Illuminate\). The framework is an Infrastructure detail: only Infrastructure may touch it.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Test\.php$#'
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(FRAMEWORK_NAMESPACES)#'
    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '#^(Psr|Ramsey|Brick|Symfony\\Component\\Uid)\\#'
  ruleset:
    # The domain depends on nothing outside itself — PHP, PSR interfaces and the value libraries
    # listed in technical-preferences `php_domain_allow` (add their namespaces to the Vendor layer).
    Domain:
      - Vendor
    Application:
      - Domain
      - Vendor
    Infrastructure:
      - Domain
      - Application
      - Framework
      - Vendor
